name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "lib/**"
      - "ios/**"
      - "pubspec.yaml"
      - ".github/workflows/build-ipa.yml"

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 新版 Flutter 在 --no-codesign 后仍会因缺少 Development Team 返回 1，
      # 但 Xcode 往往已经产出 Runner.app，据此打包未签名 IPA。
      - name: Build iOS (unsigned)
        run: |
          set +e
          flutter build ios --release --no-codesign
          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            echo "Runner.app not found"
            ls -la build/ios/iphoneos || true
            exit 1
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r asean-weather-ai.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: asean-weather-ai-ipa
          path: asean-weather-ai.ipa
          if-no-files-found: error
