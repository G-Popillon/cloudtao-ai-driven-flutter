name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "lib/**"
      - "ios/**"
      - "pubspec.yaml"
      - ".github/workflows/build-ipa.yml"

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
          flutter precache --ios

      - name: Generate iOS config
        run: flutter build ios --release --no-codesign --config-only

      - name: Xcode unsigned device build
        run: |
          cd ios
          pod install
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath ../build/ios_derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        run: |
          APP_PATH=$(find build/ios_derived -name Runner.app -type d | head -n 1)
          echo "Using $APP_PATH"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r asean-weather-ai.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: asean-weather-ai-ipa
          path: asean-weather-ai.ipa
          if-no-files-found: error
